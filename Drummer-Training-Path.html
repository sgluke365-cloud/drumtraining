<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drummer Training Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: sticky header with four tabs; Today is a single column card stack; Practice is a
   controls column beside a stage column that collapses to one column on a phone. */
:root {
  --bg: #e9ecf0;
  --surface: #f6f7f9;
  --surface2: #dde2e8;
  --ink: #151a21;
  --muted: #566170;
  --line: #c6ccd5;
  --brass: #8a5f0e;
  --brass-fill: #c9921f;
  --brass-soft: #f0e2c0;
  --ok: #17835a;
  --early: #2f6bc9;
  --late: #c9610f;
  --bad: #b83a3a;
  --ok-soft: #cfeadd;
  --early-soft: #d3e1f6;
  --late-soft: #f6dcc4;
  --bad-soft: #f3d3d3;
  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101318;
    --surface: #1a1f26;
    --surface2: #252b34;
    --ink: #e8ebef;
    --muted: #9ba5b3;
    --line: #333b46;
    --brass: #e1b350;
    --brass-fill: #d9a441;
    --brass-soft: #3a2f16;
    --ok: #3fcb8c;
    --early: #78a9f5;
    --late: #f2a05a;
    --bad: #f27a7a;
    --ok-soft: #173a2c;
    --early-soft: #1c2f4d;
    --late-soft: #44290f;
    --bad-soft: #4a2222;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101318; --surface: #1a1f26; --surface2: #252b34; --ink: #e8ebef; --muted: #9ba5b3; --line: #333b46;
  --brass: #e1b350; --brass-fill: #d9a441; --brass-soft: #3a2f16;
  --ok: #3fcb8c; --early: #78a9f5; --late: #f2a05a; --bad: #f27a7a;
  --ok-soft: #173a2c; --early-soft: #1c2f4d; --late-soft: #44290f; --bad-soft: #4a2222;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
}
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.1; }
p { margin: 0; }
a { color: var(--brass); text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brass-fill); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { max-width: 1080px; margin: 0 auto; padding-block: 0 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); padding-block: 14px 0; border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: space-between; padding-bottom: 10px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { flex: none; color: var(--brass); }
.brand h1 { font-size: 26px; }
.brand p { font-size: 13px; color: var(--muted); }
.tabs { display: flex; gap: 2px; overflow-x: auto; }
.tab { appearance: none; border: 0; background: none; padding: 10px 16px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brass-fill); }

main { padding-top: 22px; display: flex; flex-direction: column; gap: 18px; }
main > section:not([hidden]) { display: flex; flex-direction: column; gap: 18px; }

/* Cards and buttons */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
.card h3 { font-size: 22px; margin-bottom: 8px; }
.btn { appearance: none; border: 1px solid var(--ink); background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; line-height: 1.2; }
.btn:hover { filter: brightness(1.15); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); filter: none; }
.btn.brass { background: var(--brass-fill); border-color: var(--brass-fill); color: #1b1405; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { justify-content: space-between; }
input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--brass-fill); flex: none; margin: 0; cursor: pointer; }
input[type="number"], select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; padding: 0; margin: 0; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 8px; border-radius: 999px; background: var(--line); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -6px; border-radius: 50%; background: var(--brass-fill); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--ink); }
input[type="range"]::-moz-range-track { height: 8px; border-radius: 999px; background: var(--line); }
input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--brass-fill); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--ink); }

/* Today */
.datebar { display: flex; gap: 14px; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; }
.datebar h2 { font-size: 34px; }
.banner { background: var(--brass-soft); border: 1px solid var(--brass-fill); border-radius: 10px; padding: 12px 16px; }
.weekstrip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.dchip { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 4px; cursor: pointer; text-align: center; display: flex; flex-direction: column; gap: 2px; align-items: center; }
.dchip b { font-family: var(--font-display); font-size: 18px; font-weight: 600; line-height: 1; }
.dchip small { color: var(--muted); font-size: 11px; }
.dchip[aria-current="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.dchip.done { background: var(--ok-soft); border-color: var(--ok); }
.dchip.today { border-color: var(--brass-fill); }
.dchip.today small:last-child { color: var(--brass); font-weight: 600; }
.shape { display: grid; grid-template-columns: 3fr 8fr 4fr; gap: 4px; margin-bottom: 16px; }
.shape div { background: var(--surface2); border-radius: 6px; padding: 7px 10px; font-size: 13px; min-width: 0; }
.shape div:nth-child(2) { background: var(--brass-soft); }
.shape b { display: block; font-family: var(--font-display); font-size: 17px; font-weight: 600; }
.shape span { color: var(--muted); font-size: 12px; display: block; }
.dotask { font-size: 18px; line-height: 1.45; max-width: 62ch; margin-bottom: 14px; }
.links { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.links li { overflow-wrap: anywhere; }
.links li.plain { color: var(--muted); }
.links .ext::after { content: ' ↗'; }
.done-row { display: flex; align-items: center; gap: 10px; font-weight: 600; cursor: pointer; }
.presets { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
.preset { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.preset .name { font-weight: 600; }
.preset .sub { font-size: 13px; color: var(--muted); }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface2); color: var(--ink); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--late-soft); color: var(--late); }
details > summary { cursor: pointer; font-weight: 600; }
details.card > summary { list-style: none; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary::after { content: '+'; font-family: var(--font-mono); color: var(--muted); font-size: 18px; }
details.card[open] > summary::after { content: '–'; }
details.card[open] > summary { margin-bottom: 14px; }
.rules { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }

/* Checklist */
.meter { height: 10px; background: var(--surface2); border-radius: 999px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--brass-fill); border-radius: 999px; }
.bar-row { display: flex; gap: 14px; align-items: center; }
.bar-row .meter { flex: 1; }
.skills { list-style: none; margin: 0; padding: 0; }
.skills > li, .daylist > li, .cplist > li, .afterlist > li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.skills > li:first-child, .daylist > li:first-child, .cplist > li:first-child, .afterlist > li:first-child { border-top: 0; }
.daylist, .cplist, .afterlist { list-style: none; margin: 0; padding: 0; }
.daylist .dname { font-family: var(--font-display); font-weight: 600; font-size: 17px; margin-right: 8px; }
.daylist .ddate { color: var(--muted); font-size: 13px; }
.daylist p { margin: 2px 0 6px; max-width: 70ch; }
.daylist > li.done > div p { color: var(--muted); }
.skill-name { font-weight: 600; }
.skill-meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
.week-head { display: flex; justify-content: space-between; width: 100%; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.week-head h3 { margin: 0; font-size: 21px; }
.week-head .count { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.phase-intro { color: var(--muted); max-width: 70ch; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-top: 0; }

/* Practice */
.practice { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); grid-template-areas: "ex stage" "mic stage"; grid-template-rows: auto 1fr; gap: 18px; align-items: start; }
.p-ex { grid-area: ex; min-width: 0; }
.p-stage { grid-area: stage; }
.p-mic { grid-area: mic; }
.stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field > label, .field > .lab { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.bpm { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 8px; align-items: stretch; }
.bpm input { text-align: center; font-family: var(--font-display); font-size: 30px; font-weight: 600; padding: 2px; }
.bpm button { font-size: 22px; padding: 0; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; appearance: none; border: 0; background: var(--surface); padding: 8px 6px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.tip { font-size: 13px; color: var(--muted); }
.pattern { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; }
.pattern i { font-style: normal; font-family: var(--font-mono); font-size: 12px; width: 22px; height: 24px; display: grid; place-items: center; border-radius: 4px; background: var(--surface2); color: var(--muted); }
.pattern i.A { background: var(--ink); color: var(--surface); font-weight: 600; }
.pattern i.x { background: var(--surface2); color: var(--ink); }
.pattern i.g { background: transparent; border: 1px dashed var(--muted); }
.pattern i.f { background: repeating-linear-gradient(45deg, var(--surface2), var(--surface2) 3px, var(--surface) 3px, var(--surface) 6px); }
.pattern i.gap { margin-right: 6px; }
.meterwrap { position: relative; height: 22px; background: var(--surface2); border-radius: 6px; overflow: hidden; }
.meterwrap .lvl { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ok); width: 0; transition: width 60ms linear; }
.meterwrap .gate { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--brass-fill); box-shadow: 0 0 0 1px var(--surface); }
.flash { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--surface2); transition: background 80ms; }
.flash.on { background: var(--brass-fill); }
.status { padding: 10px 12px; border-radius: 8px; background: var(--surface2); font-size: 14px; }
.status.err { background: var(--bad-soft); color: var(--bad); }
.status.ok { background: var(--ok-soft); color: var(--ok); }
.stage { padding: 14px; }
.stagehead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.stagehead h3 { margin: 0; font-size: 24px; }
.bigbpm { font-family: var(--font-display); font-weight: 600; font-size: 44px; line-height: 1; }
.bigbpm small { font-size: 14px; letter-spacing: .08em; color: var(--muted); margin-left: 6px; }
.beats { display: flex; gap: 8px; }
.beats i { width: 18px; height: 18px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--line); }
.beats i.on { background: var(--brass-fill); border-color: var(--brass-fill); }
.lanewrap { background: var(--surface2); border-radius: 8px; overflow: hidden; }
canvas.lane { display: block; width: 100%; height: 190px; }
.readout { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; min-height: 54px; margin-top: 10px; }
.last { font-family: var(--font-display); font-size: 40px; font-weight: 600; line-height: 1; min-width: 9ch; }
.last.ok { color: var(--ok); } .last.early { color: var(--early); } .last.late { color: var(--late); } .last.extra { color: var(--bad); }
.progress { height: 6px; background: var(--surface2); border-radius: 999px; overflow: hidden; margin-top: 10px; }
.progress i { display: block; height: 100%; width: 0; background: var(--ink); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 8px; }
.legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; background: var(--c, var(--ink)); }

/* Results */
.result-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; margin-bottom: 14px; }
.scorebox { width: 124px; height: 124px; border-radius: 50%; display: grid; place-items: center; text-align: center; border: 6px solid var(--line); }
.scorebox.pass { border-color: var(--ok); }
.scorebox.fail { border-color: var(--late); }
.scorebox b { font-family: var(--font-display); font-size: 56px; line-height: 1; font-weight: 600; display: block; }
.scorebox span { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.verdict { font-family: var(--font-display); font-size: 28px; font-weight: 600; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 14px; }
.metric { background: var(--surface2); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.metric b { display: block; font-family: var(--font-mono); font-size: 20px; font-weight: 500; }
.metric span { font-size: 12px; color: var(--muted); }
.notes { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.notes li { padding: 8px 12px; border-radius: 8px; border-left: 4px solid var(--muted); background: var(--surface2); }
.notes li.good { border-left-color: var(--ok); }
.notes li.warn { border-left-color: var(--late); }
.stepmap { max-height: 240px; overflow: auto; display: flex; flex-direction: column; gap: 3px; padding: 2px; }
.stepmap .bar { display: flex; gap: 2px; align-items: center; }
.stepmap .bn { width: 26px; flex: none; font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
.stepmap i { flex: 1; min-width: 6px; height: 16px; border-radius: 3px; background: var(--surface2); }
.stepmap i.ok { background: var(--ok); }
.stepmap i.early { background: var(--early); }
.stepmap i.late { background: var(--late); }
.stepmap i.miss { background: transparent; border: 2px solid var(--bad); }
.stepmap i.free { background: repeating-linear-gradient(45deg, var(--surface2), var(--surface2) 3px, var(--surface) 3px, var(--surface) 6px); }
.stepmap i.rest { background: transparent; border: 1px dashed var(--line); }
.stepmap i.beat { margin-right: 4px; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--muted); font-family: var(--font-mono); font-size: 10px; }
svg.chart .band { fill: var(--ok-soft); }
svg.chart .zero { stroke: var(--ink); stroke-width: 1; opacity: .5; }
svg.chart .grid { stroke: var(--line); stroke-width: 1; }
svg.chart .pt-ok { fill: var(--ok); } svg.chart .pt-early { fill: var(--early); } svg.chart .pt-late { fill: var(--late); } svg.chart .pt-extra { fill: none; stroke: var(--bad); stroke-width: 1.5; }
svg.chart .line { fill: none; stroke: var(--ink); stroke-width: 2; }
svg.chart .passline { stroke: var(--ok); stroke-dasharray: 4 4; stroke-width: 1; }
#p-result { scroll-margin-top: 96px; }
.ramp { background: var(--brass-soft); border: 1px solid var(--brass-fill); border-radius: 8px; padding: 10px 14px; }

/* Progress */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.tile b { display: block; font-family: var(--font-display); font-size: 38px; font-weight: 600; line-height: 1.05; }
.tile span { font-size: 13px; color: var(--muted); }

@media (max-width: 760px) {
  .practice { grid-template-columns: minmax(0, 1fr); grid-template-areas: "ex" "stage" "mic"; }
  .datebar h2 { font-size: 28px; }
  .result-head { grid-template-columns: minmax(0, 1fr); justify-items: start; }
  .shape { grid-template-columns: 1fr; }
  .brand h1 { font-size: 22px; }
  .tab { padding: 10px 11px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <ellipse cx="20" cy="27" rx="15" ry="6" stroke="currentColor" stroke-width="2.4"/>
          <path d="M5 27v5c0 3.3 6.7 6 15 6s15-2.7 15-6v-5" stroke="currentColor" stroke-width="2.4"/>
          <path d="M9 4l14 17M31 4L17 21" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
        <div>
          <h1>Drummer Training Path</h1>
          <p>16 weeks, 15 minutes a day, funk focus</p>
        </div>
      </div>
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button class="tab" role="tab" data-act="tab" data-view="today" aria-selected="true">Today</button>
        <button class="tab" role="tab" data-act="tab" data-view="practice" aria-selected="false">Practice</button>
        <button class="tab" role="tab" data-act="tab" data-view="checklist" aria-selected="false">Checklist</button>
        <button class="tab" role="tab" data-act="tab" data-view="progress" aria-selected="false">Progress</button>
      </nav>
    </div>
  </header>
  <main>
    <div id="warn" class="banner" hidden></div>
    <section id="view-today" aria-label="Today"></section>
    <section id="view-practice" aria-label="Practice" hidden></section>
    <section id="view-checklist" aria-label="Checklist" hidden></section>
    <section id="view-progress" aria-label="Progress" hidden></section>
  </main>
  <noscript><p class="card">This app needs JavaScript.</p></noscript>
</div>
<script>
/* Drummer Training Path: onset detection, exercise library and scoring.
   No DOM access here, so the same file runs in the page and in Node tests. */
(function (root) {
'use strict';

/* ---------- Onset detector (also runs inside the AudioWorklet) ---------- */
class OnsetDetector {
  constructor(sampleRate, opts) {
    opts = opts || {};
    this.sr = sampleRate;
    this.gate = opts.gate !== undefined ? opts.gate : -42;
    this.flux = opts.flux !== undefined ? opts.flux : 8;

    '  constructor(options) {\n' +

/* Time (in seconds) of every metronome click for a take.

/* ---------- Scoring: pattern exercises ---------- */
function levelStats(arr) { return { n: arr.length, mean: mean(arr), sd: sdev(arr) }; }

function scoreTake(ex, o) {
  var spb = ex.spb, sd = 60 / o.bpm / spb, barDur = 240 / o.bpm;

  for (var r = 0; r < o.reps; r++) chars += one;
  var total = chars.length;
  var win = Math.min(0.5 * sd, 0.12);
  var lat = o.latency || 0;
  var slots = new Array(total);
  var extras = [];
  var freeHits = 0;
  var i;
  for (i = 0; i < total; i++) slots[i] = null;

  o.onsets.forEach(function (on) {
    var tt = on.t - lat;
    var idx = Math.round((tt - o.t0) / sd);
    if (idx < 0 || idx >= total) return;
    var err = tt - (o.t0 + idx * sd);
    var c = chars.charAt(idx);
    if (c === 'f') { freeHits++; return; }
    if (Math.abs(err) > win || c === '.') { extras.push({ idx: idx, err: err, t: tt }); return; }
    var cur = slots[idx];
    if (!cur) slots[idx] = { idx: idx, err: err, db: on.db, t: tt, c: c };
    else if (Math.abs(err) < Math.abs(cur.err)) {
      extras.push({ idx: idx, err: cur.err, t: cur.t });
      slots[idx] = { idx: idx, err: err, db: on.db, t: tt, c: c };
    } else extras.push({ idx: idx, err: err, t: tt });
  });

  var expected = [];
  for (i = 0; i < total; i++) if ('xAg'.indexOf(chars.charAt(i)) >= 0) expected.push(i);
  var hits = expected.map(function (k) { return slots[k]; }).filter(Boolean);
  var nExp = expected.length;
  var errsMs = hits.map(function (h) { return h.err * 1000; });
  var absMs = errsMs.map(Math.abs);
  var credits = expected.reduce(function (s, k) { return s + (slots[k] ? credit(Math.abs(slots[k].err)) : 0); }, 0);
  var timingScore = nExp ? 100 * credits / nExp : 0;
  var extraRatio = nExp ? Math.min(1, extras.length / nExp) : 0;

  /* Loudness by note class */
  var byC = { A: [], x: [], g: [] };
  hits.forEach(function (h) { byC[h.c].push(h.db); });
  var L = { A: levelStats(byC.A), x: levelStats(byC.x), g: levelStats(byC.g) };
  var rules = [];
  var normal = L.x.n >= 3 ? L.x : (L.g.n >= 3 ? L.g : null);
  if (L.A.n >= 2 && normal) {
    var gap = L.A.mean - normal.mean;
    var tgt = ex.landing ? 3 : 4;
    rules.push({ id: 'accent', label: ex.landing ? 'Crash/accent louder than the groove' : 'Accents louder than regular notes',
      value: r1(gap), unit: 'dB', target: tgt, cmp: '>=', pass: gap >= tgt, ratio: clamp(gap / tgt, 0, 1) });
  }
  if (L.g.n >= 3 && L.A.n >= 3) {
    var gap2 = L.A.mean - L.g.mean;

      value: r1(gap2), unit: 'dB', target: 6, cmp: '>=', pass: gap2 >= 6, ratio: clamp(gap2 / 6, 0, 1) });
  }

      value: r1(L.x.sd), unit: 'dB', target: 3.5, cmp: '<=', pass: L.x.sd <= 3.5, ratio: clamp(3.5 / Math.max(L.x.sd, 0.1), 0, 1) });

  for (i = 0; i < total; i += spb * 4) if (chars.substr(i, spb * 4).indexOf('f') >= 0) fillBars++;
  var fillNote = null;
  if (ex.landing && fillBars > 0) {

  var within50 = nExp ? absMs.filter(function (v) { return v <= 50; }).length / nExp : 0;

  var cells = [];
  for (i = 0; i < total; i++) {
    var ch = chars.charAt(i), st = 'rest', e = null;

    }

  expected.forEach(function (k) { if (!slots[k]) { var lb = stepLabel(k % (spb * 4), spb); missBy[lb] = (missBy[lb] || 0) + 1; } });
  var missList = Object.keys(missBy).map(function (k) { return { label: k, n: missBy[k] }; }).sort(function (a, b) { return b.n - a.n; });

    kind: 'take', bpm: o.bpm, reps: o.reps, spb: spb, stepsPerBar: spb * 4,
    expected: nExp, matched: hits.length, missed: nExp - hits.length, extras: extras.length, freeHits: freeHits,
    hitRate: nExp ? hits.length / nExp : 0,
    meanErr: r1(meanErr), sdErr: r1(sdErr), meanAbs: r1(mean(absMs)), within30: within30, within50: within50,
    drift: r1(drift), levels: L, rules: rules, timingScore: Math.round(timingScore),
    levelScore: levelScore === null ? null : Math.round(levelScore),
    score: score, pass: score >= 80 && (nExp ? hits.length / nExp >= 0.9 : false), cells: cells,
    points: hits.map(function (h) { return { i: h.idx, err: h.err * 1000, c: h.c }; }),
    extraPoints: extras.map(function (e2) { return { i: e2.idx, err: e2.err * 1000 }; }),
    missList: missList, fillNote: fillNote
  };
  res.notes = advise(res, ex);
  return res;
}

/* ---------- Scoring: free play and recordings ---------- */
function scoreFree(o) {

  var t0 = o.t0;

    on.forEach(function (x) { var a = 2 * Math.PI * (x.t / sd); sx += Math.cos(a); sy += Math.sin(a); });
    var ang = Math.atan2(sy, sx);

    var err = tt - (t0 + idx * sd);

    meanErr: r1(mean(errs)), sdErr: r1(sdev(errs)), meanAbs: r1(mean(absMs)),

    within50: on.length ? absMs.filter(function (v) { return v <= 50; }).length / on.length : 0,

    extraPoints: [], missList: [], phase: phase, hits: on.length, bars: r1(bars),

/* ---------- Latency calibration from the metronome's own clicks ---------- */
function calibrateLatency(clickTimes, onsets) {
  var delays = [];
  clickTimes.forEach(function (ct) {
    for (var i = 0; i < onsets.length; i++) {
      var d = onsets[i].t - ct;

/* ---------- Coaching text ---------- */
function advise(res, ex) {
  var n = [];
  function add(kind, text) { n.push({ kind: kind, text: text }); }
  var free = res.kind !== 'take';
  if (res.matched === 0) {
    add('warn', 'No hits were picked up. Raise the microphone sensitivity (move the threshold line down) or move the mic closer, then check the meter flashes on each hit.');
    return n;
  }
  if (!free) {
    if (res.hitRate < 0.9) {
      var top = res.missList.slice(0, 3).map(function (m) { return m.label + ' (' + m.n + 'x)'; }).join(', ');
      add('warn', 'You hit ' + Math.round(res.hitRate * 100) + '% of the expected notes. Most misses: ' + top + '. If you did play them, they may be too quiet for the threshold.');
    } else add('good', 'You played ' + Math.round(res.hitRate * 100) + '% of the expected notes.');
    if (res.extras > Math.max(2, res.expected * 0.08)) add('warn', res.extras + ' extra hits landed off the grid or on rests. Slow the tempo by 4 to 8 BPM, or check for double triggers from a loud ringing cymbal.');
  }
  if (res.within30 >= 0.85) add('good', Math.round(res.within30 * 100) + '% of your hits were within 30 ms of the grid.');
  else add('warn', 'Only ' + Math.round(res.within30 * 100) + '% of hits were within 30 ms of the grid. Aim for 85% or more.');
  if (Math.abs(res.meanErr) >= 12) {
    add('info', 'On average you were ' + Math.abs(res.meanErr) + ' ms ' + (res.meanErr < 0 ? 'ahead of' : 'behind') +
      ' the click. A steady offset like this is normal for the first weeks. If it is more than 40 ms, run the latency calibration on the Practice tab.');
  }
  if (res.sdErr > 25) add('warn', 'Your timing spread is ' + res.sdErr + ' ms, so hits are uneven. Drop the tempo by 4 to 8 BPM and aim for a smaller spread rather than speed.');
  else if (res.sdErr <= 15 && res.matched >= 8) add('good', 'Tight spread of ' + res.sdErr + ' ms between hits.');
  if (Math.abs(res.drift) >= 4) add('warn', 'You were ' + (res.drift > 0 ? 'slowing down' : 'speeding up') + ' by about ' + Math.abs(res.drift) + ' ms every bar.');
  (res.rules || []).forEach(function (q) {
    var line = q.label + ': ' + q.value + ' ' + q.unit + ' (aim for ' + (q.cmp === '>=' ? 'at least ' : 'at most ') + q.target + ' ' + q.unit + ').';
    add(q.pass ? 'good' : 'warn', line);
  });
  if (res.fillNote) add('warn', res.fillNote);
  if (free) {
    if (res.gapBeats > 4) add('warn', 'There was a pause of about ' + res.gapBeats + ' beats. Keep the groove going between ideas.');
    if (res.kind === 'recording' && res.phase !== null) add('info', 'Grid lock ' + Math.round(res.phase * 100) + '%. Near 100% means every hit sits on one steady grid; low values mean the tempo wandered or the BPM setting is off.');
    if (res.dynRange !== null) add('info', 'Dynamic range between your quiet and loud hits: ' + res.dynRange + ' dB. Ghost notes and backbeats should be clearly apart (aim for 10 dB or more).');
    add('info', 'Free play scores timing only. It cannot tell which drum you hit, so notes are not checked.');
  }
  return n;
}

/* ---------- Tempo ramp rule from the plan ---------- */
/* "Add 4 BPM only after three clean passes in a row." takes: [{exId,bpm,score}] oldest first. */
function rampAdvice(takes, exId, bpm, passMark) {
  passMark = passMark || 80;
  var run = 0;
  for (var i = takes.length - 1; i >= 0; i--) {
    var t = takes[i];
    if (t.exId !== exId || t.bpm !== bpm) continue;
    if (t.score >= passMark) run++; else break;
  }
  return { run: run, ready: run >= 3, next: bpm + 4 };
}

  S.data.last[L.exId] = L.bpm;
  S.addTake({
    ts: Date.now(), day: L.day ? (L.day.w - 1) * 7 + L.day.d + 1 : null, exId: L.exId, bpm: L.bpm, reps: L.reps, click: L.click, kind: res.kind, score: res.score, pass: res.pass,
    hitRate: Math.round(res.hitRate * 100) / 100, meanErr: res.meanErr, sdErr: res.sdErr, within30: Math.round(res.within30 * 100) / 100, drift: res.drift
  });
  el['s-hint'].textContent = L.ex.mode === 'free' ? '' : rampText();
}

/* ---------- Latency calibration ---------- */
function calibrate() {
  if (live || calib) return;
  el['m-cal-msg'].textContent = 'Starting the microphone…';
  ensureMic().then(function () {
    var ctx = mic.ctx, t = ctx.currentTime + 0.6, times = [];
    mic.out.gain.value = 1;
    for (var i = 0; i < 8; i++) { times.push(t + i * 0.6); playBuf(mic.buf.acc, t + i * 0.6); }
    calib = { times: times, onsets: [] };
    el['m-cal-msg'].textContent = 'Listening to the click through your speakers. Stay quiet for 6 seconds.';
    setTimeout(function () {
      var c = calib; calib = null;
      if (mic.out) mic.out.gain.value = S.data.settings.vol;
      var r = E.calibrateLatency(c.times, c.onsets);
      if (r.n >= 5 && r.sd <= 20) {
        S.data.settings.latency = clamp(r.ms, 0, 400); S.save();
        el['m-lat'].value = S.data.settings.latency;
        el['m-cal-msg'].textContent = 'Measured ' + r.ms + ' ms (spread ' + r.sd + ' ms) and applied it.';
      } else {
        el['m-cal-msg'].textContent = 'Heard ' + r.n + ' of 8 clicks' + (r.n >= 5 ? ' with an uneven delay' : '') + '. Use speakers rather than headphones, raise the system volume, keep the room quiet, then try again. You can also type a delay yourself.';
      }
    }, 6200);
  }).catch(function (err) { el['m-cal-msg'].textContent = micErrorText(err); });
}

/* ---------- Recording analysis ---------- */
function decode(ctx, buf) {
  return new Promise(function (resolve, reject) {
    var r = ctx.decodeAudioData(buf, resolve, reject);
    if (r && r.then) r.then(resolve, reject);
  });
}
function analyseFile(file) {
  var rm = el['r-msg'];
  rm.textContent = 'Reading ' + file.name + '…';
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { rm.textContent = 'This browser cannot decode audio.'; return; }
  var reader = new FileReader();
  reader.onerror = function () { rm.textContent = 'Could not read that file.'; };
  reader.onload = function () {
    var ctx = mic.ctx || new AC();
    decode(ctx, reader.result).then(function (ab) {
      var sr = ab.sampleRate, n = ab.length, nc = ab.numberOfChannels, data = ab.getChannelData(0), i, c;
      if (nc > 1) {
        data = new Float32Array(n);
        for (c = 0; c < nc; c++) { var cd = ab.getChannelData(c); for (i = 0; i < n; i++) data[i] += cd[i] / nc; }
      }
      var probe = new E.OnsetDetector(sr, { gate: 200 }), dbs = [];
      for (i = 0; i + 128 <= n; i += 128) dbs.push(probe.process(data.subarray(i, i + 128), i / sr).db);
      dbs.sort(function (a, b) { return a - b; });
      var top = dbs.length ? dbs[Math.floor((dbs.length - 1) * 0.995)] : -60;
      var gate = clamp(top - 30, -55, -25);
      var det = new E.OnsetDetector(sr, { gate: gate }), ons = [];
      for (i = 0; i + 128 <= n; i += 128) {
        var r = det.process(data.subarray(i, i + 128), i / sr);
        for (var k = 0; k < r.onsets.length; k++) ons.push(r.onsets[k]);
      }
      if (ons.length < 8) { rm.textContent = 'Only ' + ons.length + ' hits were found in ' + file.name + '. Is the drum sound loud enough in the recording?'; return; }
      normalize();
      var ex = EX[P.exId], d = ons[ons.length - 1].t - ons[0].t, reps = Math.max(1, Math.round(d / (240 / P.bpm)));
      var res = E.scoreFree({ bpm: P.bpm, spb: ex.spb, t0: ons[0].t, dur: d, onsets: ons, latency: 0, phaseFit: true, reps: reps });
      var L = { ex: ex, exId: P.exId, bpm: P.bpm, reps: reps, click: 'off', day: null, recording: file.name };
      save(res, L);
      rm.textContent = 'Found ' + ons.length + ' hits in ' + fmtDur(d) + ' of playing (threshold ' + Math.round(gate) + ' dB).';
      renderResult(res, L);
    }).catch(function () { rm.textContent = 'This browser could not decode that file. Try an .m4a, .mp3 or .wav, or a different video format.'; });
  };
  reader.readAsArrayBuffer(file);
}

/* ---------- Results ---------- */
function hideResult() { el['p-result'].hidden = true; el['p-result'].innerHTML = ''; }

function timingChart(res) {
  var W = 640, H = 210, pl = 38, pr = 8, pt = 20, pb = 22, range = 75;
  var maxI = res.kind === 'take' ? res.cells.length : 1;
  res.points.forEach(function (p) { if (p.i + 1 > maxI) maxI = p.i + 1; });
  function X(i) { return pl + (maxI > 1 ? i / (maxI - 1) : 0.5) * (W - pl - pr); }
  function Y(ms) { return pt + (1 - (clamp(ms, -range, range) + range) / (2 * range)) * (H - pt - pb); }
  var g = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Timing of every hit. Points inside the green band are within 30 milliseconds of the grid.">';
  g += '<rect class="band" x="' + pl + '" y="' + Y(30) + '" width="' + (W - pl - pr) + '" height="' + (Y(-30) - Y(30)) + '"/>';
  [-60, -30, 0, 30, 60].forEach(function (v) {
    g += '<line class="' + (v === 0 ? 'zero' : 'grid') + '" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text x="' + (pl - 5) + '" y="' + (Y(v) + 3) + '" text-anchor="end">' + (v > 0 ? '+' : '') + v + '</text>';
  });
  res.points.forEach(function (p) {
    var cls = Math.abs(p.err) <= 30 ? 'pt-ok' : (p.err < 0 ? 'pt-early' : 'pt-late');
    g += '<circle class="' + cls + '" cx="' + X(p.i).toFixed(1) + '" cy="' + Y(p.err).toFixed(1) + '" r="2.8"><title>' + Math.round(p.err) + ' ms</title></circle>';
  });
  (res.extraPoints || []).forEach(function (p) {
    g += '<circle class="pt-extra" cx="' + X(p.i).toFixed(1) + '" cy="' + Y(p.err).toFixed(1) + '" r="3.4"><title>extra hit</title></circle>';
  });
  g += '<text x="' + pl + '" y="' + (H - 6) + '">start</text><text x="' + (W - pr) + '" y="' + (H - 6) + '" text-anchor="end">end</text>' +
       '<text x="' + (pl + 4) + '" y="12">late \u2191</text><text x="' + (W / 2) + '" y="' + (H - 6) + '" text-anchor="middle">\u2193 early</text></svg>';
  return g;
}
function stepMap(res) {
  var per = res.stepsPerBar, spb = res.spb, h = '', bars = Math.ceil(res.cells.length / per);
  for (var b = 0; b < bars; b++) {
    h += '<div class="bar"><span class="bn">' + (b + 1) + '</span>';
    for (var k = 0; k < per; k++) {
      var cell = res.cells[b * per + k];
      if (!cell) break;
      var tip = E.stepLabel(k, spb) + (cell.err !== null ? ', ' + (cell.err > 0 ? '+' : '') + Math.round(cell.err) + ' ms' : (cell.st === 'miss' ? ', missed' : (cell.st === 'free' ? ', free' : '')));
      h += '<i class="' + cell.st + (k % spb === spb - 1 && k < per - 1 ? ' beat' : '') + '" title="' + esc(tip) + '"></i>';
    }
    h += '</div>';
  }
  return h;
}
function signed(v) { return (v > 0 ? '+' : '') + v; }

function renderResult(res, L) {
  var take = res.kind === 'take';
  var verdict = res.pass ? (take ? 'Clean pass' : 'Steady') :
    (res.matched === 0 ? 'No hits heard' : (take && res.hitRate < 0.9 ? 'Too many missed notes' : 'Not there yet'));
  var sub = L.ex.name + ' at ' + L.bpm + ' BPM' + (L.recording ? ' (recording: ' + L.recording + ')' : ', ' + L.reps + (L.reps === 1 ? ' repeat' : ' repeats')) +
    (take ? '' : '. Timing only: which drum you hit is not checked.');
  var h = '<div class="result-head"><div class="scorebox ' + (res.pass ? 'pass' : 'fail') + '"><div><b>' + res.score + '</b><span>of 100</span></div></div>' +
    '<div><div class="eyebrow">Result</div><div class="verdict">' + esc(verdict) + '</div><p class="muted">' + esc(sub) + '</p></div></div>';

  var m = [];
  if (take) m.push(['Notes hit', res.matched + ' / ' + res.expected]);
  else m.push(['Hits heard', String(res.matched)]);
  m.push(['Timing spread', res.sdErr + ' ms']);
  m.push(['Average offset', signed(res.meanErr) + ' ms']);
  m.push(['Within 30 ms', Math.round(res.within30 * 100) + '%']);
  if (take) m.push(['Extra hits', String(res.extras)]);
  m.push(['Drift per bar', signed(res.drift) + ' ms']);
  if (res.kind === 'recording' && res.phase !== null) m.push(['Grid lock', Math.round(res.phase * 100) + '%']);
  if (!take && res.dynRange !== null) m.push(['Loud to soft', res.dynRange + ' dB']);
  h += '<div class="metrics">' + m.map(function (x) { return '<div class="metric"><b>' + esc(x[1]) + '</b><span>' + esc(x[0]) + '</span></div>'; }).join('') + '</div>';

  h += '<ul class="notes">' + res.notes.map(function (n) { return '<li class="' + (n.kind === 'good' ? 'good' : (n.kind === 'warn' ? 'warn' : '')) + '">' + esc(n.text) + '</li>'; }).join('') + '</ul>';

  var acts = '';
  if (take && !L.recording) {
    var ramp = E.rampAdvice(rampTakes(), L.exId, L.bpm, 80);
    h += '<div class="ramp" style="margin-bottom:14px">' + (ramp.ready
      ? '<b>' + ramp.run + ' clean passes in a row at ' + L.bpm + ' BPM.</b> The plan says to add 4 BPM now.'
      : '<b>' + ramp.run + ' of 3</b> clean passes in a row at ' + L.bpm + ' BPM. Add 4 BPM after three.') + '</div>';
    if (ramp.ready) acts += '<button class="btn brass" data-r="faster" data-bpm="' + ramp.next + '">Try ' + ramp.next + ' BPM</button>';
  }
  h += '<h4 style="font-size:18px;margin:4px 0 6px">Timing of every hit</h4>' + timingChart(res);
  if (take) {
    h += '<h4 style="font-size:18px;margin:16px 0 6px">Note map</h4><p class="tip" style="margin-bottom:6px">One row per bar, a gap after each beat. Hover a cell for its step and timing.</p>' +
      '<div class="stepmap" role="img" aria-label="Map of every expected note, coloured by timing">' + stepMap(res) + '</div>' +
      '<div class="legend"><span style="--c:var(--ok)">Within 30 ms</span><span style="--c:var(--early)">Early</span><span style="--c:var(--late)">Late</span><span style="--c:var(--bad)">Missed</span></div>';
  }
  var cur = S.data.settings.latency;
  if (take && L.click !== 'off' && Math.abs(res.meanErr) >= 25) {
    var nl = clamp(Math.round(cur + res.meanErr), 0, 400);
    acts += '<button class="btn ghost" data-r="lat" data-ms="' + nl + '">Set delay to ' + nl + ' ms</button>';
    h += '<p class="tip" style="margin-top:12px">If you were playing in time with the click you heard and every take shows this same offset, the delay setting is off, not your timing. The button above applies the correction.</p>';
  }
  if (L.day && res.pass && !L.recording && !S.isDone('w' + L.day.w + 'd' + L.day.d)) {
    acts += '<button class="btn" data-r="done" data-id="w' + L.day.w + 'd' + L.day.d + '">Mark that day done</button>';
  }
  h += '<div class="row" style="margin-top:16px"><button class="btn ghost" data-r="again">Play it again</button>' + acts + '</div>';
  var box = el['p-result'];
  box.innerHTML = h;
  box.hidden = false;
  if (typeof box.scrollIntoView === 'function') { try { box.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) { /* ignore */ } }
}
function onResultClick(e) {
  var b = e.target.closest('[data-r]');
  if (!b) return;
  var a = b.getAttribute('data-r');
  if (a === 'again') startTake();
  else if (a === 'faster') { P.bpm = parseInt(b.getAttribute('data-bpm'), 10); hideResult(); sync(); }
  else if (a === 'lat') { S.data.settings.latency = parseInt(b.getAttribute('data-ms'), 10); S.save(); el['m-lat'].value = S.data.settings.latency; b.disabled = true; b.textContent = 'Delay set to ' + S.data.settings.latency + ' ms'; }
  else if (a === 'done') { App.markDone(b.getAttribute('data-id')); b.disabled = true; b.textContent = 'Marked done'; }
}

/* ---------- Public API ---------- */
return {
  mount: function (section) {
    root = section;
    build();
    bindControls();
    sync();
  },
  show: function () { visible = true; if (root) { sync(); if (mic.on && !mic.loop) { mic.loop = true; meterLoop(); } } },
  hide: function () { visible = false; },
  open: function (p) {
    if (live || !root) return;
    P.exId = p.exId; P.bpm = p.bpm; P.reps = p.reps || EX[p.exId].reps; P.click = p.click || 'on'; P.day = p.day || null;
    hideResult();
    sync();
    msg('Ready.');
  },
  _debug: function () { return { P: P, live: !!live, mic: { on: mic.on, using: mic.using } }; }
};
})();

App.start();

</script>
</body>
</html>
